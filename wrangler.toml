# Cloudflare runs `npx wrangler deploy` from the git repo root.
# The Astro app lives in ./overwatch-hack-.net - build there, then publish dist.
name = "destiny2hack"
main = "overwatch-hack-.net/workers/site.js"
compatibility_date = "2026-09-12"

[build]
command = "npm ci --prefix overwatch-hack-.net && npm run build --prefix overwatch-hack-.net"

[[routes]]
pattern = "destiny2hack.org"
custom_domain = true

[[routes]]
pattern = "www.destiny2hack.org"
custom_domain = true

[assets]
directory = "./overwatch-hack-.net/dist"
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "drop-trailing-slash"
# Serve crawler SEO files as static assets (not Worker-first) so GSC can fetch
# sitemaps reliably. Worker still handles www→apex + legacy sitemap redirects.
run_worker_first = [
  "/*",
  "!/favicon.svg",
  "!/sitemap.xml",
  "!/sitemap-index.xml",
  "!/sitemap.css",
  "!/robots.txt",
  "!/_astro/*",
  "!/media/*",
  "!/videos/*",
  "!/og/*",
]
