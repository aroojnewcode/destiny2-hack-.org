# Cloudflare Workers + static assets — required so CI `npx wrangler deploy` succeeds.
# (Dashboard is locked to that command; `wrangler pages deploy` is not used.)
name = "destiny2hack"
main = "workers/site.js"
compatibility_date = "2026-09-12"

# Cloudflare CI invokes `npx wrangler deploy` directly. Build Astro first so
# the static-assets directory exists before Wrangler validates it.
[build]
command = "npm run build"

[[routes]]
pattern = "destiny2hack.org"
custom_domain = true

[[routes]]
pattern = "www.destiny2hack.org"
custom_domain = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "drop-trailing-slash"
# Serve crawler SEO files as static assets (not Worker-first) so GSC can fetch
# sitemaps reliably. Worker still handles www→apex + legacy sitemap redirects.
run_worker_first = [
  "/*",
  "!/favicon.svg",
  "!/sitemap.xml",
  "!/sitemap-index.xml",
  "!/sitemap.css",
  "!/robots.txt",
  "!/_astro/*",
  "!/media/*",
  "!/videos/*",
  "!/og/*",
]
